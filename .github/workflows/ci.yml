name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve commit range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          event_name="${{ github.event_name }}"

          if [ "$event_name" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            echo "log_opts=${base}..${head}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${head}~1" >/dev/null 2>&1; then
              echo "log_opts=${head}~1..${head}" >> "$GITHUB_OUTPUT"
            else
              echo "log_opts=${head}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "log_opts=${before}..${head}" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks on new commits
        run: gitleaks git --config=config/gitleaks.toml --no-banner --redact --log-opts="${{ steps.range.outputs.log_opts }}"

  regression-policy:
    name: Regression Policy Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enforce production-failure eval regression policy
        run: npm run qa:eval:enforce-regressions

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        continue-on-error: true
        run: npm run lint

      - name: Type-check Electron, daemon and CLI runtime
        run: |
          npm run build:electron
          npm run build:daemon
          npm run build:cli

      - name: Run renderer type check
        # Renderer has an existing baseline of unrelated errors. Keep the
        # complete compiler output visible without blocking the native runtime
        # and Windows execution-chain delivery gates.
        continue-on-error: true
        run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Run tests
        run: npm test

  targeted-eval:
    name: Targeted Eval (Agent Changes)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect agent-path changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            agent:
              - 'src/electron/agent/**'
              - 'src/electron/agent/tools/**'

      - name: Setup Node.js
        if: steps.changes.outputs.agent == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.agent == 'true'
        run: npm ci

      - name: Install sqlite3 CLI
        if: steps.changes.outputs.agent == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Run targeted deterministic eval suite
        if: steps.changes.outputs.agent == 'true'
        run: npm run qa:eval:run -- --suite reliability-regressions --mode deterministic
        env:
          NEOWORKER_DB_PATH: ${{ runner.temp }}/neoworker-eval.db
          NEOWORKER_EVAL_ALLOW_EMPTY: '1'

      - name: Enforce timeline reliability thresholds
        if: steps.changes.outputs.agent == 'true'
        run: npm run qa:timeline:enforce
        env:
          NEOWORKER_DB_PATH: ${{ runner.temp }}/neoworker-eval.db
          NEOWORKER_EVAL_ALLOW_EMPTY: '1'

      - name: Skip notice
        if: steps.changes.outputs.agent != 'true'
        run: echo "No agent-path changes detected. Skipping targeted eval gate."

  windows-agent-runtime:
    name: Windows Agent Runtime
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Electron main process
        run: npm run build:electron

      - name: Verify Hermes host launcher contract
        run: python scripts/qa/test_hermes_host_launcher.py

      - name: Run Windows execution-chain tests
        run: >-
          npx vitest --config config/vitest.config.ts run
          src/electron/agent/sandbox/__tests__/sandbox-factory.test.ts
          src/electron/agent/sandbox/__tests__/windows-package-manager-launch.test.ts
          src/electron/agent/sandbox/__tests__/windows-process.integration.test.ts
          src/electron/agent/tools/__tests__/shell-tools.test.ts
          src/electron/agent/tools/__tests__/shell-environment.test.ts
          src/electron/documents/__tests__/office-translation.test.ts
          src/electron/utils/__tests__/durable-temp-artifact.test.ts
          src/electron/utils/__tests__/PptxPreviewService.test.ts
          tests/electron/pptx-extractor.test.ts
          src/electron/agent/tools/__tests__/shell-session-manager.test.ts
          src/electron/agent/tools/__tests__/windows-shell-session.integration.test.ts
          src/electron/agent/runtime/__tests__/tool-host-protocol.test.ts
          src/electron/agent/runtime/__tests__/ToolScheduler.test.ts
          src/electron/agent/runtime/__tests__/hermes-fault-injection.test.ts
          src/electron/agent/runtime/__tests__/hermes-acp-client.test.ts
          src/electron/agent/runtime/__tests__/hermes-tool-host-mcp.test.ts
          src/electron/agent/runtime/__tests__/hermes-host-launcher.test.ts
          src/electron/agent/runtime/__tests__/hermes-host-owned-toolchain.test.ts
          src/electron/agent/__tests__/executor-hermes-recovery.test.ts
          src/electron/agent/runtime/__tests__/tool-execution-coordinator.test.ts

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [secret-scan, lint-and-typecheck, test, windows-agent-runtime]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare package.json for electron-builder
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = pkg.dependencies || {};
            pkg.devDependencies = pkg.devDependencies || {};
            for (const dep of ['electron', '@electron/rebuild']) {
              if (pkg.dependencies[dep]) {
                pkg.devDependencies[dep] = pkg.dependencies[dep];
                delete pkg.dependencies[dep];
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Package macOS application
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows x64 application
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: npm run package:win:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: NeoWorker-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: warn
