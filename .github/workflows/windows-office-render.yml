name: Windows Office Render

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-office-render.yml
      - scripts/qa/office-render-smoke.cjs
      - src/electron/utils/measure-pptx-text-fit.ts
      - src/electron/utils/pptx-render-input.ts
      - src/electron/utils/PptxPreviewService.ts
      - src/electron/documents/pptx-translation-layout.ts
      - scripts/qa/translation-text-fit-fixtures.cjs

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Force HTTPS for Git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run setup:officecli
      - run: npm run build:electron
      - name: Renderer and checkpoint regression tests
        run: npx vitest --config config/vitest.config.ts run src/electron/utils/__tests__/pptx-render-input.test.ts src/electron/utils/__tests__/PptxPreviewService.test.ts src/electron/utils/__tests__/pptx-preview-renderer.test.ts src/electron/documents/__tests__/pptx-translation-layout.test.ts src/electron/agent/tools/__tests__/document-tools.test.ts --maxWorkers=1
      - name: Translation timeout and follow-up completion regressions
        run: npx vitest --config config/vitest.config.ts run src/electron/agent/__tests__/executor-tool-timeouts.test.ts src/electron/agent/__tests__/executor-finalization-state.test.ts src/electron/agent/__tests__/daemon-complete-task.test.ts src/electron/agent/tools/__tests__/document-tools.test.ts --maxWorkers=1
      - name: Real translation render with large assets and Unicode paths
        run: node scripts/qa/office-render-smoke.cjs
      - name: Real translation layout fixtures
        run: node node_modules/electron/cli.js scripts/qa/translation-text-fit-fixtures.cjs
