name: Publish tagged desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing source tag to build and publish
        required: true
        default: v0.2.4

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Fonts are OS-provided prerequisites on the ephemeral validation runners.
      # Never include proprietary font files in application or release artifacts.
      - name: Prepare required macOS PDF fonts
        if: runner.os == 'macOS'
        timeout-minutes: 6
        shell: bash
        run: |
          python -u - <<'PYTHON'
          import hashlib, io, pathlib, subprocess, zipfile
          # Pinned STFangsong asset and archive digest from Apple's Font7 catalogue.
          url = 'https://updates.cdn-apple.com/2022/mobileassets/071-94074/A35B26C1-991C-4C22-B709-5C253473EE88/com_apple_MobileAsset_Font7/1821952872c81043711aab6910052b65da8edf2c.zip'
          expected_sha1 = '69df5c0af8793167ac5c31c031f5a2e2ea1e84e0'
          print('Downloading Apple system font: STFangsong', flush=True)
          data = subprocess.check_output(['curl', '--fail', '--location', '--retry', '2', '--max-time', '90', url])
          if hashlib.sha1(data).hexdigest() != expected_sha1:
              raise RuntimeError('Apple font asset checksum mismatch')
          destination = pathlib.Path.home() / 'Library/Fonts'
          destination.mkdir(parents=True, exist_ok=True)
          installed = []
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for entry in archive.infolist():
                  if pathlib.PurePosixPath(entry.filename).suffix.lower() in ('.ttf', '.otf', '.ttc'):
                      target = destination / pathlib.PurePosixPath(entry.filename).name
                      target.write_bytes(archive.read(entry))
                      installed.append(target.name)
          if not installed:
              raise RuntimeError('Apple font archive contains no fonts')
          print('Installed system fonts:', installed, flush=True)
          if not pathlib.Path('/System/Library/Fonts/Supplemental/Times New Roman.ttf').is_file():
              raise RuntimeError('Times New Roman is unavailable on this runner')
          PYTHON
      - name: Prepare required Windows PDF fonts
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fontDirectory = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path (Join-Path $fontDirectory 'simfang.ttf'))) {
            # Official Server 2025 Languages and Optional Features media from:
            # https://www.microsoft.com/en-us/evalcenter/evaluate-windows-server-2025
            # Use offline servicing to avoid unavailable Windows Update services.
            $isoPath = Join-Path $env:RUNNER_TEMP 'server-2025-optional-features.iso'
            Write-Host 'Downloading official Microsoft optional-font installation media'
            curl.exe --fail --location --retry 2 --max-time 600 'https://go.microsoft.com/fwlink/?linkid=2273506' --output $isoPath
            if ($LASTEXITCODE -ne 0) { throw 'Microsoft optional-feature media download failed' }
            try {
              $volume = Mount-DiskImage -ImagePath $isoPath -PassThru | Get-Volume
              $root = "$($volume.DriveLetter):\"
              $cab = Get-ChildItem $root -Recurse -Filter '*LanguageFeatures-Fonts-Hans*.cab' | Select-Object -First 1
              if (!$cab) { throw 'Simplified Chinese supplemental fonts missing from Microsoft media' }
              Write-Host "Installing Microsoft supplemental fonts from $($cab.DirectoryName)"
              Add-WindowsCapability -Online -Name 'Language.Fonts.Hans~~~und-Hans~0.0.1.0' -Source $cab.DirectoryName -LimitAccess
            } finally {
              Dismount-DiskImage -ImagePath $isoPath -ErrorAction SilentlyContinue
              Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
            }
          }
          foreach ($fontFile in @('simfang.ttf', 'times.ttf')) {
            if (!(Test-Path (Join-Path $fontDirectory $fontFile))) { throw "Required PDF font missing: $fontFile" }
            Write-Host "Available PDF font: $fontFile"
          }
      - name: Verify tag, version and architecture
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const version = require('./package.json').version;
          assert.match(process.env.RELEASE_TAG, /^[vV]\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG.slice(1), version);
          assert.equal(require('./package-lock.json').packages[''].version, version);
          assert.equal(process.arch, process.platform === 'darwin' ? 'arm64' : 'x64');
          console.log(`Building ${process.env.RELEASE_TAG} (${version}) for ${process.platform}-${process.arch}`);
          NODE
      - name: Force HTTPS for GitHub dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Cache pinned Numbat toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/neoworker/numbat-build
          key: ${{ runner.os }}-numbat-${{ hashFiles('resources/numbat/source-manifest.json') }}
      - name: Install dependencies and Electron
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          for attempt in 1 2 3 4 5; do
            if node node_modules/electron/install.js; then break; fi
            if [ "${attempt}" -eq 5 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Update UI and smoke process regressions
        shell: bash
        run: |
          set -euo pipefail
          npx vitest --config config/vitest.config.ts run src/electron/updater/__tests__/update-manager-config.test.ts src/renderer/components/__tests__/Sidebar.test.ts --maxWorkers=1
          node --test scripts/qa/desktop-smoke-process.test.mjs
      - name: PDF delivery regressions
        run: npx vitest --config config/vitest.config.ts run src/electron/utils/__tests__/pdf-generator.test.ts src/electron/utils/__tests__/pdf-math.test.ts src/electron/agent/__tests__/verified-delivery-artifacts.test.ts src/renderer/components/__tests__/ProjectContextPanel.test.ts src/renderer/components/__tests__/main-content-working-state.test.ts --maxWorkers=1
      - name: PPT content-editing regressions
        run: npx vitest --config config/vitest.config.ts run src/electron/agent/__tests__/presentation-edit-policy.test.ts src/electron/agent/tools/__tests__/use-skill.test.ts src/electron/agent/tools/__tests__/skill-tools-artifact-registration.test.ts src/electron/agent/tools/__tests__/office-artifact-input-normalizer.test.ts --maxWorkers=1
      - name: Native PPT template regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa/test_presentation_template_edit.py
          node scripts/qa/presentation-content-edit.mjs
          node scripts/qa/presentation-template-fill.mjs
      - name: Build macOS installer and verify launch
        if: runner.os == 'macOS'
        run: npm run package:mac:unsigned
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: npm run package:win:x64
      - name: Network and translation regressions
        if: runner.os == 'Windows'
        run: npx vitest --config config/vitest.config.ts run src/electron/utils/__tests__/network-fetch.test.ts src/electron/agent/search/__tests__/duckduckgo-provider.test.ts src/electron/agent/tools/__tests__/web-fetch-tools.test.ts src/electron/agent/__tests__/executor-tool-timeouts.test.ts src/electron/agent/__tests__/executor-finalization-state.test.ts src/electron/agent/__tests__/daemon-complete-task.test.ts src/electron/agent/tools/__tests__/document-tools.test.ts --maxWorkers=1
      - name: Electron network and Office smoke checks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa/proxy-failure-recovery.cjs
          node scripts/qa/public-search-smoke.cjs
          node scripts/qa/office-render-smoke.cjs
          node node_modules/electron/cli.js scripts/qa/translation-text-fit-fixtures.cjs
      - name: Packaged PDF image delivery smoke
        shell: bash
        run: |
          node node_modules/electron/cli.js scripts/qa/pdf-delivery-smoke.cjs
          node node_modules/electron/cli.js scripts/qa/pdf-math-smoke.cjs
      - name: Scan packaged app for secrets
        run: npm run package:secrets:verify
      - name: Install, launch and uninstall Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: npm run package:win:smoke -- --expected-version="${RELEASE_TAG:1}"
      - name: Stage verified release assets with provenance and checksums
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const version = require('./package.json').version;
          const platform = process.platform === 'darwin' ? 'macos-arm64' : 'windows-x64';
          const expected = process.platform === 'darwin' ? `NeoWorker-${version}-arm64.dmg` : `NeoWorker-${version}-windows-x64-setup.exe`;
          if (!fs.existsSync(path.join('release', expected))) throw Error(`Missing installer: ${expected}`);
          fs.mkdirSync('desktop-release-assets', {recursive:true});
          const hashes = [];
          for (const name of fs.readdirSync('release')) {
            if (!(name.startsWith(`NeoWorker-${version}-`) && /\.(dmg|exe|zip|blockmap)$/.test(name)) && !/^latest(?:-mac)?\.yml$/.test(name)) continue;
            const data = fs.readFileSync(path.join('release',name));
            fs.writeFileSync(path.join('desktop-release-assets',name),data);
            hashes.push(crypto.createHash('sha256').update(data).digest('hex')+'  '+name);
          }
          fs.writeFileSync(`desktop-release-assets/SHA256SUMS-${platform}.txt`,hashes.join('\n')+'\n');
          fs.writeFileSync(`desktop-release-assets/build-${platform}.json`,JSON.stringify({tag:process.env.RELEASE_TAG,version,commit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),platform,run:process.env.GITHUB_RUN_ID},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: verified-desktop-${{ runner.os }}
          path: desktop-release-assets/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish tagged release after both platforms pass
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v6
        with:
          pattern: verified-desktop-*
          path: desktop-release-assets
          merge-multiple: true
      - name: Verify downloaded checksums and tagged source
        shell: bash
        run: |
          set -euo pipefail
          (cd desktop-release-assets && sha256sum --check SHA256SUMS-*.txt)
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          for(const platform of ['macos-arm64','windows-x64']) {
            const build=JSON.parse(fs.readFileSync(`desktop-release-assets/build-${platform}.json`));
            assert.equal(build.commit,commit);assert.equal(build.tag,process.env.RELEASE_TAG);
          }
          const version=require('./package.json').version;
          const changelog=fs.readFileSync('docs/CHANGELOG.md','utf8');
          const start=changelog.indexOf(`## [${version}]`);
          const entry=start<0?'':changelog.slice(start).split(/\n## \[/)[0]
            .replace(/\bHermes\b/gi, 'the execution service');
          fs.writeFileSync('desktop-release-notes.md',`# NeoWorker ${process.env.RELEASE_TAG}\n\n`+
            `Source commit: \`${commit}\` Both platform installers were built from this tag and passed regression tests, packaged-secret scans, and installation and launch checks.\n\n`+
            `- macOS: Apple Silicon / arm64. Download the .dmg installer. The app is ad-hoc signed and is not notarized by Apple.\n`+
            `- Windows: x64. Download the -setup.exe installer.\n`+
            `- SHA256SUMS files verify downloads; build JSON files record the source commit and build provenance.\n\n`+entry+'\n');
          NODE
      - name: Upload assets and publish release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "NeoWorker $RELEASE_TAG" --notes-file desktop-release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" desktop-release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "NeoWorker $RELEASE_TAG" --notes-file desktop-release-notes.md --draft=false --latest
