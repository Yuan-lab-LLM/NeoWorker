name: Windows Installer Smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected package version"
        required: true
        default: "0.2.1"

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Force HTTPS for GitHub git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Setup Python for embedded Hermes runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Cache pinned Numbat toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/neoworker/numbat-build
          key: ${{ runner.os }}-numbat-${{ hashFiles('resources/numbat/source-manifest.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # .npmrc disables lifecycle scripts, so install the QA runtime explicitly.
      - name: Install Electron runtime for network verification
        run: node node_modules/electron/install.js

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "${{ inputs.expected_version }}") {
            throw "Expected version ${{ inputs.expected_version }}, found $version"
          }

      - name: Test source-preserving PPT content editing
        run: npx vitest --config config/vitest.config.ts run src/electron/agent/__tests__/presentation-edit-policy.test.ts src/electron/agent/tools/__tests__/use-skill.test.ts src/electron/agent/tools/__tests__/skill-tools-artifact-registration.test.ts src/electron/agent/tools/__tests__/office-artifact-input-normalizer.test.ts --maxWorkers=1

      - name: Verify native PPT template editing
        run: |
          python scripts/qa/test_presentation_template_edit.py
          node scripts/qa/presentation-content-edit.mjs
          node scripts/qa/presentation-template-fill.mjs

      - name: Package Windows installer
        run: npm run package:win:x64

      - name: Test proxy failure recovery
        run: >-
          npx vitest --config config/vitest.config.ts run
          src/electron/utils/__tests__/network-fetch.test.ts
          src/electron/agent/search/__tests__/duckduckgo-provider.test.ts
          src/electron/agent/tools/__tests__/web-fetch-tools.test.ts
          --maxWorkers=1

      - name: Verify real Electron broken-proxy recovery
        run: node scripts/qa/proxy-failure-recovery.cjs

      - name: Verify public search and source reading on Windows
        run: node scripts/qa/public-search-smoke.cjs

      - name: Translation timeout and follow-up completion regressions
        run: npx vitest --config config/vitest.config.ts run src/electron/agent/__tests__/executor-tool-timeouts.test.ts src/electron/agent/__tests__/executor-finalization-state.test.ts src/electron/agent/__tests__/daemon-complete-task.test.ts src/electron/agent/tools/__tests__/document-tools.test.ts --maxWorkers=1
      - name: Verify PPT translation rendering on Windows
        run: node scripts/qa/office-render-smoke.cjs

      - name: Verify translation layout regressions on Windows
        run: node node_modules/electron/cli.js scripts/qa/translation-text-fit-fixtures.cjs

      - name: Verify packaged app contains no API keys
        run: npm run package:secrets:verify

      - name: Smoke Windows installer
        run: npm run package:win:smoke -- --expected-version=${{ inputs.expected_version }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: NeoWorker-${{ inputs.expected_version }}-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/*.sha256
          if-no-files-found: error
