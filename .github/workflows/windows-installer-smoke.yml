name: Windows Installer Smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected package version"
        required: true
        default: "0.2.5"

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Force HTTPS for GitHub git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Setup Python for embedded Hermes runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Cache pinned Numbat toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/neoworker/numbat-build
          key: ${{ runner.os }}-numbat-${{ hashFiles('resources/numbat/source-manifest.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # .npmrc disables lifecycle scripts, so install the QA runtime explicitly.
      - name: Install Electron runtime for network verification
        run: node node_modules/electron/install.js

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "${{ inputs.expected_version }}") {
            throw "Expected version ${{ inputs.expected_version }}, found $version"
          }

      - name: Verify internal model, news and browser regressions
        run: >-
          npx vitest --config config/vitest.config.ts run
          src/electron/ipc/__tests__/provider-base-url.test.ts
          src/electron/ipc/__tests__/llm-settings-save.test.ts
          src/electron/agent/llm/__tests__/openai-compatible-provider-errors.test.ts
          src/electron/agent/llm/__tests__/provider-factory-custom-config.test.ts
          src/electron/paper-news/
          src/shared/news-images.test.ts
          src/renderer/components/__tests__/paper-news-behavior.test.ts
          src/renderer/components/__tests__/news-gallery-notes.test.ts
          src/renderer/components/__tests__/browser-reading.test.ts
          src/renderer/components/__tests__/browser-selection-probe.test.ts
          src/renderer/components/__tests__/browser-frame-navigation.test.ts
          src/electron/ipc/paper-news-handlers.test.ts
          --maxWorkers=1

      - name: Verify Hermes host launcher contract
        run: python scripts/qa/test_hermes_host_launcher.py

      - name: Verify scheduled conversation reuse and WeChat reconnect delivery
        run: >-
          npx vitest --config config/vitest.config.ts run
          src/electron/cron/
          src/electron/gateway/__tests__/weixin.test.ts
          src/electron/gateway/__tests__/weixin-context.test.ts
          src/electron/database/__tests__/TaskRepository.findAll.test.ts
          src/renderer/__tests__/sidebar-helpers.test.ts
          src/renderer/utils/automation-runs.test.ts
          src/renderer/utils/automation-delivery.test.ts
          --maxWorkers=1

      - name: Test source-preserving PPT content editing
        run: npx vitest --config config/vitest.config.ts run src/electron/agent/__tests__/presentation-edit-policy.test.ts src/electron/agent/tools/__tests__/use-skill.test.ts src/electron/agent/tools/__tests__/skill-tools-artifact-registration.test.ts src/electron/agent/tools/__tests__/office-artifact-input-normalizer.test.ts --maxWorkers=1

      - name: Verify native PPT template editing
        run: |
          python scripts/qa/test_presentation_template_edit.py
          node scripts/qa/presentation-content-edit.mjs
          node scripts/qa/presentation-template-fill.mjs

      - name: Prepare OfficeCLI for document regression tests
        run: npm run setup:officecli -- --platform win32 --arch x64

      - name: Translation timeout and follow-up completion regressions
        run: npx vitest --config config/vitest.config.ts run src/electron/agent/__tests__/executor-tool-timeouts.test.ts src/electron/agent/__tests__/executor-finalization-state.test.ts src/electron/agent/__tests__/daemon-complete-task.test.ts src/electron/agent/tools/__tests__/document-tools.test.ts --maxWorkers=1

      - name: Build Electron for document rendering checks
        run: npm run build:electron

      - name: Verify PPT translation rendering on Windows
        run: node scripts/qa/office-render-smoke.cjs

      - name: Verify translation layout regressions on Windows
        run: node node_modules/electron/cli.js scripts/qa/translation-text-fit-fixtures.cjs

      - name: Package Windows installer
        run: npm run package:win:x64

      - name: Test proxy failure recovery
        run: >-
          npx vitest --config config/vitest.config.ts run
          src/electron/utils/__tests__/network-fetch.test.ts
          src/electron/agent/search/__tests__/duckduckgo-provider.test.ts
          src/electron/agent/tools/__tests__/web-fetch-tools.test.ts
          --maxWorkers=1

      - name: Verify real Electron broken-proxy recovery
        run: node scripts/qa/proxy-failure-recovery.cjs

      - name: Verify public search and source reading on Windows
        run: node scripts/qa/public-search-smoke.cjs

      - name: Verify packaged app contains no API keys
        run: npm run package:secrets:verify

      - name: Smoke Windows installer
        run: npm run package:win:smoke -- --expected-version=${{ inputs.expected_version }}

      - name: Record installer provenance and checksum
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const version = require('./package.json').version;
          const artifact = `NeoWorker-${version}-windows-x64-setup.exe`;
          const data = fs.readFileSync(`release/${artifact}`);
          const sha256 = crypto.createHash('sha256').update(data).digest('hex');
          const report = {
            version, artifact, bytes: data.length, sha256,
            platform: process.platform, arch: process.arch,
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
            builtAt: new Date().toISOString(), run: process.env.GITHUB_RUN_ID,
            validation: {regressions: 'passed', packagedSecretScan: 'passed', installLaunchUninstall: 'passed'}
          };
          fs.writeFileSync('release/build-windows-x64.json', JSON.stringify(report, null, 2)+'\n');
          fs.writeFileSync(`release/${artifact}.sha256`, sha256+'  '+artifact+'\n');
          NODE

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: NeoWorker-${{ inputs.expected_version }}-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/*.sha256
            release/build-windows-x64.json
          if-no-files-found: error
