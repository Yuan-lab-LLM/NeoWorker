name: Windows Public Search
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-public-search.yml
      - scripts/qa/public-search-smoke.cjs
permissions:
  contents: read
jobs:
  search:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Force HTTPS for Git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run build:electron
      - name: Search, parsing and network regressions
        run: npx vitest --config config/vitest.config.ts run src/electron/agent/search/__tests__ src/electron/agent/tools/__tests__/search-tools.test.ts src/electron/agent/tools/__tests__/web-fetch-tools.test.ts src/electron/utils/__tests__/network-fetch.test.ts --maxWorkers=1
      - run: node scripts/qa/proxy-failure-recovery.cjs
      - run: node scripts/qa/public-search-smoke.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-public-search-report
          path: public-search-smoke.json
